name: ai-scope
on:
  issues:
    types: [opened]
jobs:
  scope:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: "TokenLogic-com-au/github-workflows/.github/workflows/ai-comment.yml@<github-workflows commit SHA>" # REQUIRED: pin to the reviewed github-workflows commit
    with:
      kind: scope
      backend: openrouter
      dry_run: ${{ vars.AI_SCOPE_LIVE != 'true' }}
      board_app_ref: "<board app commit SHA>" # REQUIRED: pin to the reviewed board app commit
      config: config.json
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BOARD_APP_PRIVATE_KEY: ${{ secrets.BOARD_APP_PRIVATE_KEY }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
