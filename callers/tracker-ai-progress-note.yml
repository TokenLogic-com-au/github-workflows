name: ai-progress-note
on:
  schedule:
    - cron: "0 9 * * 1" # Monday 09:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
jobs:
  note:
    permissions:
      contents: read
      issues: write
    uses: "TokenLogic-com-au/github-workflows/.github/workflows/ai-progress-note.yml@<github-workflows commit SHA>" # REQUIRED: pin to the reviewed github-workflows commit
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' && fromJson(inputs.dry_run) || true }}
      board_app_ref: "<board app commit SHA>" # REQUIRED: pin to the reviewed board app commit
      backend: openrouter
    secrets:
      BOARD_APP_PRIVATE_KEY: ${{ secrets.BOARD_APP_PRIVATE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
