# Template for a repo's own .github/dependabot.yml (not a workflow). github-actions and gitsubmodule weekly; npm left out (updates spammed the repo).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
