name: ai-comment
on:
  workflow_call:
    inputs:
      kind:
        required: true
        type: string
      backend:
        type: string
        default: anthropic
      dry_run:
        type: boolean
        default: true
      board_app_ref:
        description: "Board app commit SHA, required for kind: scope."
        type: string
        default: ""
      config:
        type: string
        default: board-tool/config.json
      discord_bot_ref:
        description: "Bot commit SHA, required for kind: scope."
        type: string
        default: ""
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false
      BOARD_APP_PRIVATE_KEY:
        required: false
      DISCORD_BOT_TOKEN:
        required: false
permissions: {}
defaults:
  run:
    shell: bash
concurrency:
  group: ai-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false
env:
  DRY_RUN: ${{ inputs.dry_run == false && '0' || '1' }}
  AI_OUTPUT_CAP: "20000"
  MARKER: "<!-- github-workflows-ai -->"
jobs:
  collect:
    # A review only runs when the ai-review label was just added, and only
    # against a same-repo PR head (never a fork). A scope check keeps the
    # 24h recency gate below; a review drops it -- re-adding the label is
    # the recency control for reviews.
    if: >-
      github.event.repository.private &&
      (inputs.kind != 'review' ||
        (github.event.action == 'labeled' && github.event.label.name == 'ai-review' &&
         github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      number: ${{ steps.gate.outputs.number }}
    steps:
      - name: Validate required inputs for scope kind
        if: inputs.kind == 'scope'
        run: |
          missing=()
          [ -z "${{ inputs.board_app_ref }}" ] && missing+=("board_app_ref")
          [ -z "${{ inputs.discord_bot_ref }}" ] && missing+=("discord_bot_ref")
          [ -z "${{ inputs.config }}" ] && missing+=("config")
          [ -z "${{ vars.TRACKER_REPO }}" ] && missing+=("vars.TRACKER_REPO")
          [ -z "${{ vars.BOARD_APP_REPO }}" ] && missing+=("vars.BOARD_APP_REPO")
          [ -z "${{ vars.BOT_REPO }}" ] && missing+=("vars.BOT_REPO")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Error: kind=scope requires the following inputs/vars: $(printf '%s, ' "${missing[@]}" | sed 's/, $//')"
            exit 1
          fi
      - name: Resolve subject and recency gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KIND: ${{ inputs.kind }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          number="${PR_NUMBER:-$ISSUE_NUMBER}"
          if [ "$KIND" = "review" ]; then
            # No recency gate for reviews: the ai-review label is removed
            # after posting (see the post job), so re-adding it is already
            # an explicit, deliberate re-trigger.
            echo "number=$number" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cutoff=$(date -u -d '-24 hours' +%Y-%m-%dT%H:%M:%SZ)
          last=$(gh api --paginate "repos/$REPO/issues/$number/comments" | jq -rs --arg m "$MARKER" \
            '[.[][]|select(.user.login=="github-actions[bot]" and (.body|contains($m)))|.updated_at]|max // empty')
          if [ -z "$last" ] || [[ "$last" < "$cutoff" ]]; then
            echo "number=$number" >> "$GITHUB_OUTPUT"
          fi
      - name: Mint read-only app token
        id: mint
        if: steps.gate.outputs.number != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BOARD_APP_ID }}
          private-key: ${{ secrets.BOARD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }},${{ vars.TRACKER_REPO }},${{ vars.BOARD_APP_REPO }}
          permission-pull-requests: read
          permission-issues: read
          permission-contents: read
          permission-organization-projects: read
      - name: Check out the board app
        if: steps.gate.outputs.number != '' && inputs.kind == 'scope'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/${{ vars.BOARD_APP_REPO }}
          ref: ${{ inputs.board_app_ref }}
          path: board-tool
          token: ${{ steps.mint.outputs.token }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.gate.outputs.number != '' && inputs.kind == 'scope'
        with:
          python-version: "3.12"
      - name: Collect the subject
        if: steps.gate.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TOKEN: ${{ steps.mint.outputs.token }}
          BOARD_TOKEN: ${{ steps.mint.outputs.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.gate.outputs.number }}
          KIND: ${{ inputs.kind }}
          BODY: ${{ github.event.issue.body }}
          BOARD_CONFIG: ${{ inputs.config }}
        run: |
          if [ "$KIND" = "review" ]; then
            owner="${REPO%%/*}"
            name="${REPO#*/}"
            gh api "repos/$REPO/pulls/$NUMBER" -H "Accept: application/vnd.github.v3.diff" > diff.txt
            issue_body=$(GH_TOKEN="$ISSUE_TOKEN" gh api graphql -f query='
              query($owner:String!,$name:String!,$num:Int!){
                repository(owner:$owner,name:$name){
                  pullRequest(number:$num){
                    closingIssuesReferences(first:1){ nodes{ body } }
                  }
                }
              }' -f owner="$owner" -f name="$name" -F num="$NUMBER" \
              --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[0].body // empty')
            {
              echo "<linked-issue>"
              if [ -n "$issue_body" ]; then printf '%s\n' "$issue_body"; else echo "(no linked issue)"; fi
              echo "</linked-issue>"
              echo "<pr-diff>"
              awk '
                function flush() {
                  if (path != "") {
                    skip = (path ~ /(^|\/)(lib|broadcast|out|cache|node_modules)\//) \
                        || (path ~ /\.lock$/) \
                        || (path ~ /(^|\/)(package-lock\.json|yarn\.lock|pnpm-lock\.yaml)$/)
                    if (skip) print "(" path ": " count " lines changed, omitted)"
                    else print buf
                  }
                }
                /^diff --git / {
                  flush()
                  path = $3
                  sub(/^a\//, "", path)
                  buf = $0
                  count = 0
                  next
                }
                {
                  buf = buf "\n" $0
                  if ($0 ~ /^[+-]/ && $0 !~ /^(\+\+\+|---)/) count++
                  next
                }
                END { flush() }
              ' diff.txt
              echo "</pr-diff>"
            } > input.txt
          else
            # Assignees + board status come from the board app's issue-card
            # (the board is the source of truth for status; the raw GitHub
            # event has no notion of project-board columns), so scope.md can
            # flag a multi-assignee or a body-vs-board status mismatch.
            card=$(GH_TOKEN="$BOARD_TOKEN" python3 board-tool/board.py issue-card --config "$BOARD_CONFIG" "$NUMBER")
            assignees=$(printf '%s' "$card" | jq -r '(.assignees // []) | join(", ")')
            status=$(printf '%s' "$card" | jq -r '.status // ""')
            {
              echo "<issue-body>"
              printf '%s\n' "$BODY"
              echo "</issue-body>"
              echo "<assignees>${assignees}</assignees>"
              echo "<board-status>${status}</board-status>"
            } > input.txt
          fi
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        if: steps.gate.outputs.number != ''
        with:
          name: ai-input
          path: input.txt
  generate:
    needs: collect
    if: needs.collect.outputs.number != ''
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: TokenLogic-com-au/github-workflows/.github/actions/scripts@main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ai-input
      - name: Run ai.py
        env:
          ANTHROPIC_API_KEY: ${{ inputs.backend == 'anthropic' && secrets.ANTHROPIC_API_KEY || '' }}
          AI_API_STYLE: ${{ inputs.backend == 'openrouter' && 'openai' || 'anthropic' }}
          AI_API_URL: ${{ inputs.backend == 'openrouter' && 'https://openrouter.ai/api/v1/chat/completions' || '' }}
          AI_API_KEY: ${{ inputs.backend == 'openrouter' && secrets.OPENROUTER_API_KEY || '' }}
          AI_MODEL: ${{ inputs.backend == 'openrouter' && vars.OPENROUTER_MODEL || '' }}
          AI_REASONING_EFFORT: ${{ inputs.backend == 'openrouter' && 'low' || '' }}
          AI_RESPONSE_FORMAT: ${{ inputs.backend == 'openrouter' && 'json_object' || '' }}
          KIND: ${{ inputs.kind }}
          BACKEND: ${{ inputs.backend }}
        run: |
          case "$KIND" in review|scope) ;; *) echo "bad kind: $KIND"; exit 1;; esac
          case "$BACKEND" in anthropic|openrouter) ;; *) echo "bad backend: $BACKEND"; exit 1;; esac
          python3 "$GW/ai.py" "$KIND" input.txt out.md
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: ai-output
          path: out.md
  post:
    needs: [collect, generate]
    if: needs.collect.outputs.number != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ai-output
      - uses: TokenLogic-com-au/github-workflows/.github/actions/scripts@main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Render and post comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ needs.collect.outputs.number }}
          KIND: ${{ inputs.kind }}
        run: |
          # render_ai_comment.py builds GitHub markdown from the model's
          # structured JSON in OUR code, sanitizing every field -- the raw
          # model text never reaches this comment.
          python3 "$GW/render_ai_comment.py" "$KIND" out.md "$NUMBER" body.md
          if [ "${DRY_RUN:-1}" != "0" ]; then
            jq -nc --arg n "$NUMBER" '{would:"ai-comment",number:$n}' >&2
            exit 0
          fi
          { printf '%s\n' "$MARKER"; cat body.md; } > comment.md
          existing=$(gh api --paginate "repos/$REPO/issues/$NUMBER/comments" | jq -rs --arg m "$MARKER" \
            '[.[][]|select(.user.login=="github-actions[bot]" and (.body|contains($m)))|.id]|max // empty')
          if [ -n "$existing" ]; then
            gh api "repos/$REPO/issues/comments/$existing" -X PATCH -F body=@comment.md
          else
            gh api "repos/$REPO/issues/$NUMBER/comments" -X POST -F body=@comment.md
          fi
      - name: Remove the ai-review label so re-adding it re-triggers
        if: inputs.kind == 'review'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ needs.collect.outputs.number }}
        run: |
          if [ "${DRY_RUN:-1}" != "0" ]; then
            exit 0
          fi
          gh api "repos/$REPO/issues/$NUMBER/labels/ai-review" -X DELETE || true
      - name: Mint app token for the bot checkout
        id: mint-discord
        if: inputs.kind == 'scope'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BOARD_APP_ID }}
          private-key: ${{ secrets.BOARD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.BOT_REPO }}
          permission-contents: read
      - name: Check out the bot
        if: inputs.kind == 'scope'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/${{ vars.BOT_REPO }}
          ref: ${{ inputs.discord_bot_ref }}
          path: bot-tool
          token: ${{ steps.mint-discord.outputs.token }}
          persist-credentials: false
      - name: Single-issue quality check
        if: inputs.kind == 'scope'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ needs.collect.outputs.number }}
          AUTHOR: ${{ github.event.issue.user.login }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          title=$(gh api "repos/$REPO/issues/$NUMBER" --jq .title)
          url=$(gh api "repos/$REPO/issues/$NUMBER" --jq .html_url)
          assignees=$(gh api "repos/$REPO/issues/$NUMBER" --jq '[.assignees[].login]')
          python3 "$GW/render_ai_comment.py" results out.md "$NUMBER" "$title" "$url" "$assignees" results.json "$AUTHOR"
          python3 bot-tool/issue_quality.py single results.json
