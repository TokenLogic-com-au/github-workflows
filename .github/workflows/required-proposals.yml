name: required-proposals
# Entry point for a future org ruleset on aave-proposals-v3-style repos:
# add this as a required status check once a repo-ruleset workflow exists.
on:
  pull_request:
  merge_group:
jobs:
  proposal-checks:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: "TokenLogic-com-au/github-workflows/.github/workflows/proposal-checks.yml@main"
    with:
      min_coverage: 100
      backend: openrouter
      dry_run: true
    secrets:
      ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
      QUICKNODE_TOKEN: ${{ secrets.QUICKNODE_TOKEN }}
      QUICKNODE_ENDPOINT_NAME: ${{ secrets.QUICKNODE_ENDPOINT_NAME }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
