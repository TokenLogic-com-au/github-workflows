name: required-proposals
# Required by the proposal-checks org ruleset. PR comments post only when the
# target repo sets PROPOSAL_CHECKS_LIVE=true.
on:
  pull_request:
  merge_group:
jobs:
  proposal-checks:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: "TokenLogic-com-au/github-workflows/.github/workflows/proposal-checks.yml@main"
    with:
      min_coverage: 80
      backend: openrouter
      dry_run: ${{ vars.PROPOSAL_CHECKS_LIVE != 'true' }}
    secrets:
      ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      RPC_MONAD: ${{ secrets.RPC_MONAD }}
