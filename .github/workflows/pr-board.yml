name: pr-board
on:
  workflow_call:
    inputs:
      command:
        required: true
        type: string
      board_app_ref:
        required: true
        type: string
      dry_run:
        type: boolean
        default: true
      config:
        required: true
        type: string
    secrets:
      BOARD_APP_PRIVATE_KEY:
        required: true
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  run:
    if: github.event.pull_request.head.repo.full_name == github.repository && (inputs.command != 'pr-issue-check' || github.event.pull_request.base.ref == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate required org variables
        run: |
          missing=()
          [ -z "${{ vars.TRACKER_REPO }}" ] && missing+=("vars.TRACKER_REPO")
          [ -z "${{ vars.BOARD_APP_REPO }}" ] && missing+=("vars.BOARD_APP_REPO")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Error: pr-board requires the following org variables: $(printf '%s, ' "${missing[@]}" | sed 's/, $//')"
            exit 1
          fi
      - name: Mint checkout token (board app)
        id: mint-checkout
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BOARD_APP_ID }}
          private-key: ${{ secrets.BOARD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.BOARD_APP_REPO }}
          permission-contents: read
      - name: Check out the board app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/${{ vars.BOARD_APP_REPO }}
          ref: ${{ inputs.board_app_ref }}
          path: board-tool
          token: ${{ steps.mint-checkout.outputs.token }}
          persist-credentials: false
      - name: Run board.py
        uses: ./board-tool
        with:
          command: ${{ inputs.command }}
          args: --event ${{ github.event_path }}
          config: ${{ inputs.config }}
          app-id: ${{ vars.BOARD_APP_ID }}
          private-key: ${{ secrets.BOARD_APP_PRIVATE_KEY }}
          board-live: ${{ !inputs.dry_run }}
