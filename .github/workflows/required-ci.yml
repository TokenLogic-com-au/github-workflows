name: required-ci
# Org-ruleset entry point: rulesets cannot pass per-repo inputs, so foundry-ci runs with defaults.
on:
  pull_request:
  merge_group:
permissions:
  contents: read
  actions: read
jobs:
  ci:
    if: github.repository != 'TokenLogic-com-au/github-workflows'
    uses: TokenLogic-com-au/github-workflows/.github/workflows/foundry-ci.yml@main
    secrets:
      ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
      RPC_MONAD: ${{ secrets.RPC_MONAD }}
