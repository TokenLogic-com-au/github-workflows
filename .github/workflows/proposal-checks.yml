name: proposal-checks
# Blocking: coverage. Warnings: address-book, spelling. Advisory: forum-vs-diff and decimals check, never approval.
on:
  workflow_call:
    inputs:
      min_coverage:
        type: number
        default: 100
      backend:
        type: string
        default: openrouter
      dry_run:
        type: boolean
        default: true
    secrets:
      ALCHEMY_API_KEY:
        required: true
      OPENROUTER_API_KEY:
        required: false
      # Optional per-chain RPC override, checked by action-rpc-env before Alchemy (Alchemy Monad lacks archive).
      RPC_MONAD:
        required: false
permissions: {}
defaults:
  run:
    shell: bash
env:
  MARKER: "<!-- github-workflows-proposal-spec -->"
  # Pinned to match upstream aave-proposals-v3 CI; newer Foundry refuses non-Ethereum forks.
  FOUNDRY_VERSION: v1.7.1
jobs:
  scope:
    # Scopes every job to the single src/<dir>/ the PR touches: count==0 skips all (green), count>1 fails.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dir: ${{ steps.detect.outputs.dir }}
      count: ${{ steps.detect.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: TokenLogic-com-au/github-workflows/.github/actions/scripts@main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Detect the changed proposal folder(s)
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          result=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | python3 "$GW/proposal_scope.py")
          count=$(echo "$result" | jq -r .count)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          case "$count" in
            0)
              echo "no proposal folder changed in this PR; proposal checks skipped"
              echo "dir=" >> "$GITHUB_OUTPUT"
              ;;
            1)
              dir=$(echo "$result" | jq -r '.dirs[0]')
              echo "dir=$dir" >> "$GITHUB_OUTPUT"
              ;;
            *)
              dirs=$(echo "$result" | jq -r '.dirs | join(", ")')
              echo "::error::One proposal per PR: this PR changes $count proposal folders: $dirs"
              echo "dir=" >> "$GITHUB_OUTPUT"
              exit 1
              ;;
          esac

  address-book:
    # Consumes the diff report advisory generated; runs even if advisory failed, then unknown addresses stay warnings.
    needs: [scope, advisory]
    if: ${{ !cancelled() && needs.scope.outputs.count == '1' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      details: ${{ steps.measure.outputs.details }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: TokenLogic-com-au/github-workflows/.github/actions/scripts@main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download the CI-generated diff report
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-diff-report
          path: ${{ runner.temp }}/ci-diff-report
      - name: Find unrecognized raw addresses
        id: measure
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # src/**/*.sol incl. *.t.sol; addresses only on a `//` comment line are ignored.
          # In-book address: notice naming its constant, everywhere. Not in the book: warning, never in *.t.sol (tests use whales/mocks).
          # One nested address-book copy under aave-helpers, as upstream; a second copy clashed in forge remappings.
          # Always exits 0: a non-zero exit here lost GITHUB_OUTPUT writes on this runner (SIGPIPE from grep -q under pipefail).
          book=$(find lib/aave-helpers/lib/aave-address-book -name '*.sol' -o -name '*.ts' 2>/dev/null)
          if [ -z "$book" ]; then
            echo "lib/aave-helpers/lib/aave-address-book not found; is the submodule checked out recursively?"
            echo "status=error" >> "$GITHUB_OUTPUT"
            echo "details=$(printf '%s' 'address book not found' | base64 -w0)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          book_text_lc=$(cat $book | tr 'A-F' 'a-f')
          # A listed asset reaches the book only after execution, so its addresses are a notice. Only the CI-generated diff report is trusted for that; exactly one file or fail closed.
          report=""
          # Runner temp dir only: a workspace path could be pre-populated by the PR.
          dl="$RUNNER_TEMP/ci-diff-report"
          if [ -d "$dl" ] && [ "$(find "$dl" -type f | wc -l)" -eq 1 ]; then
            report=$(find "$dl" -type f)
          fi
          nl=$'\n'
          fail=0
          details=""
          while IFS= read -r hit; do
            [ -z "$hit" ] && continue
            file="${hit%%:*}"
            rest="${hit#*:}"
            lineno="${rest%%:*}"
            addr="${rest#*:}"
            addr_lc=$(printf '%s' "$addr" | tr 'A-F' 'a-f')
            case "$book_text_lc" in
              *"$addr_lc"*)
                const=$(python3 "$GW/address_book.py" book-constant lib/aave-helpers/lib/aave-address-book "$addr" "$file")
                msg="raw address ${addr} is in the address book; use ${const:-its address book constant}"
                echo "::notice file=$file,line=$lineno::$msg"
                details="${details}${file}|${lineno}|notice|${msg}${nl}"
                ;;
              *)
                case "$file" in *.t.sol) continue ;; esac
                pending=""
                [ -n "$report" ] && pending=$(python3 "$GW/address_book.py" pending-listing "$report" "$addr")
                if [ -n "$pending" ]; then
                  echo "::notice file=$file,line=$lineno::$pending"
                  details="${details}${file}|${lineno}|notice|${pending}${nl}"
                else
                  echo "::warning file=$file,line=$lineno::raw address $addr not found in lib/aave-address-book -- use the AaveVX.NAME constant or add it to the address book"
                  details="${details}${file}|${lineno}|warning|raw address ${addr} not in the address book${nl}"
                  fail=1
                fi
                ;;
            esac
          done < <(
            git diff -U0 "$BASE_SHA" "$HEAD_SHA" -- 'src/**/*.sol' \
              | awk '
                  /^\+\+\+ b\// { file=substr($0,7); next }
                  /^@@/ { split($0,a,"+"); split(a[2],b,","); line=b[1]+0; next }
                  /^\+/ {
                    content = substr($0,2)
                    sub(/\/\/.*/, "", content)
                    if (match(content, /0x[0-9a-fA-F]{40}/)) {
                      print file ":" line ":" substr(content, RSTART, RLENGTH)
                    }
                    line++
                    next
                  }
                '
          )
          echo "details=$(printf '%s' "$details" | base64 -w0)" >> "$GITHUB_OUTPUT"
          if [ "$fail" -eq 0 ]; then
            echo "no new unrecognized addresses"
            echo "status=ok" >> "$GITHUB_OUTPUT"
          else
            echo "status=found" >> "$GITHUB_OUTPUT"
          fi
      - name: Enforce
        env:
          STATUS: ${{ steps.measure.outputs.status }}
        run: |
          # Non-blocking; only a real error (book not found) fails.
          case "$STATUS" in
            ok) exit 0 ;;
            found) echo "unrecognized raw addresses found (non-blocking warning)"; exit 0 ;;
            *) echo "address-book check errored: $STATUS"; exit 1 ;;
          esac

  spelling:
    needs: scope
    if: needs.scope.outputs.count == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      details: ${{ steps.check.outputs.details }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: TokenLogic-com-au/github-workflows/.github/actions/scripts@main
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          # Caller's package.json may declare pnpm, which v5 would try to cache; cspell runs via npx.
          package-manager-cache: false
      - name: cspell on changed proposal .md files
        id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # cspell takes the changed-file list from argv and its config lives in github-workflows.
          files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- 'src/**/*.md')
          if [ -z "$files" ]; then
            echo "no changed proposal .md files"; exit 0
          fi
          set +e
          npx -y cspell@9.2.1 --no-progress -c "$GW/cspell.json" $files > cspell-out.txt 2>&1
          status=$?
          set -e
          cat cspell-out.txt
          nl=$'\n'
          detail=""
          if [ "$status" -ne 0 ]; then
            while IFS= read -r hit; do
              [ -z "$hit" ] && continue
              hfile="${hit%%:*}"
              rest="${hit#*:}"
              hline="${rest%%:*}"
              rest="${rest#*:}"
              rest="${rest#*- }"
              word=$(printf '%s' "$rest" | sed -n 's/.*Unknown word (\([^)]*\)).*/\1/p')
              sugg=$(printf '%s' "$rest" | sed -n 's/.*fix: (\([^)]*\)).*/\1/p')
              context=$(sed -n "${hline}p" "$hfile" 2>/dev/null | cut -c1-80)
              detail="${detail}${hfile}|${hline}|${word}|${sugg}|${context}${nl}"
            done < <(grep -E '^[^ ].*:[0-9]+:[0-9]+' cspell-out.txt | head -15 || true)
          fi
          echo "details=$(printf '%s' "$detail" | base64 -w0)" >> "$GITHUB_OUTPUT"
          # Non-blocking for typos; an output line that is neither a typo nor the summary is a real error and fails.
          extra_error_lines=$(grep -v -E '^[^ ].*:[0-9]+:[0-9]+' cspell-out.txt \
            | grep -v '^CSpell: ' | grep -v '^[[:space:]]*$' || true)
          if [ "$status" -ne 0 ] && [ -n "$extra_error_lines" ]; then
            echo "::error::cspell reported non-spelling error output; failing"
            exit 1
          fi
          if [ "$status" -eq 0 ] || [ -n "$detail" ]; then
            exit 0
          fi
          exit $status

  coverage:
    needs: scope
    if: needs.scope.outputs.count == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Upstream runs forge under [profile.test] (prague): live mainnet assets use post-shanghai opcodes (TLOAD/MCOPY) and revert with NotActivated otherwise.
      FOUNDRY_PROFILE: test
    outputs:
      pct: ${{ steps.gate.outputs.pct }}
      uncovered: ${{ steps.gate.outputs.uncovered }}
      tests: ${{ steps.gate.outputs.tests }}
      min_coverage: ${{ inputs.min_coverage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: aave-dao/github-workflows/.github/actions/foundry-setup@f3d4a12c202dcfbea2f34928e730dd53d61d91f6
        with:
          FOUNDRY_VERSION: ${{ env.FOUNDRY_VERSION }}
      - uses: aave-dao/action-rpc-env@0a4d2fc1bdaa075e24fc482eecc6c218a7aecd6b
        with:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
        env:
          RPC_MONAD: ${{ secrets.RPC_MONAD }}
      # No separate `forge build --deny notes`: upstream code warns and `forge coverage` compiles anyway.
      - name: Coverage threshold (payload contracts only)
        id: gate
        uses: TokenLogic-com-au/github-workflows/.github/actions/coverage-gate@main
        with:
          min_coverage: ${{ inputs.min_coverage }}
          path_prefix: "${{ needs.scope.outputs.dir }}/"
          exclude_suffixes: ".t.sol .s.sol scripts/"
          no_match_test: "test_defaultProposalExecution"
          match_path: "${{ needs.scope.outputs.dir }}/*.t.sol"

  advisory:
    needs: scope
    if: needs.scope.outputs.count == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      # [profile.test] (prague) for live-fork bytecode with post-shanghai opcodes.
      FOUNDRY_PROFILE: test
    outputs:
      comment_url: ${{ steps.post.outputs.comment_url }}
      has_issues: ${{ steps.post.outputs.has_issues }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: aave-dao/github-workflows/.github/actions/foundry-setup@f3d4a12c202dcfbea2f34928e730dd53d61d91f6
        with:
          FOUNDRY_VERSION: ${{ env.FOUNDRY_VERSION }}
      - uses: aave-dao/action-rpc-env@0a4d2fc1bdaa075e24fc482eecc6c218a7aecd6b
        with:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
        env:
          RPC_MONAD: ${{ secrets.RPC_MONAD }}
      - name: Recency gate (limits AI cost only; the fork test and diff report run on every push)
        id: gate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          cutoff=$(date -u -d '-24 hours' +%Y-%m-%dT%H:%M:%SZ)
          last=$(gh api --paginate "repos/$REPO/issues/$NUMBER/comments" | jq -rs --arg m "$MARKER" \
            '[.[][]|select(.user.login=="github-actions[bot]" and (.body|contains($m)))|.updated_at]|max // empty')
          if [ -z "$last" ] || [[ "$last" < "$cutoff" ]]; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Find the proposal's .md
        id: folder
        env:
          DIR: ${{ needs.scope.outputs.dir }}
        run: |
          # Folder comes from the scope job; only its .md is resolved here.
          md=$(find "$DIR" -maxdepth 1 -name '*.md' | head -1)
          if [ -z "$md" ]; then
            echo "changed folder $DIR has no .md; skipping advisory step"
            echo "md=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "md=$md" >> "$GITHUB_OUTPUT"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
      - name: Generate the fork diff report
        id: diff
        if: steps.folder.outputs.md != ''
        run: |
          # Report is always generated here, never taken from the PR (an author-committed diffs/*.md is untrusted); committed ones are set aside first. --isolate is needed: without it the gas-limit check reverts before diffReports() writes any file.
          mkdir -p diffs
          find diffs -name '*.md' -type f -print0 \
            | tar --null -T - --remove-files -cf "$RUNNER_TEMP/committed-diffs.tar" 2>/dev/null || true
          forge test --match-path "${{ steps.folder.outputs.dir }}/*.t.sol" --isolate -vv 2>&1 | tee forge-test.log || true
          mkdir -p diffs
          # Every CI-written report is joined, in name order, under a per-payload heading; zero reports leaves `report` empty.
          produced=$(find diffs -name '*.md' -type f | sort)
          report=""
          if [ -n "$produced" ]; then
            mkdir -p "$RUNNER_TEMP/ci-diff-report"
            report="$RUNNER_TEMP/ci-diff-report/report.md"
            : > "$report"
            while IFS= read -r f; do
              { printf '# Payload report: %s\n\n' "$(basename "$f" .md)"; cat "$f"; printf '\n'; } >> "$report"
            done <<< "$produced"
            echo "ci_report=$report" >> "$GITHUB_OUTPUT"
          fi
          echo "report=$report" >> "$GITHUB_OUTPUT"
          # Read from the log even when reports exist: one payload's test can fail while others write reports.
          fail_test=$(sed -nE 's/^\[FAIL:[^]]*\] ([A-Za-z0-9_]+)\(.*/\1/p' forge-test.log | head -1)
          if [ -z "$fail_test" ] && [ -z "$report" ]; then
            fail_test="forge test failed with no further detail"
          fi
          echo "fork_test_status=$fail_test" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        if: steps.diff.outputs.ci_report != ''
        with:
          name: ci-diff-report
          path: ${{ steps.diff.outputs.ci_report }}
          if-no-files-found: error
      - name: Fetch forum raw text
        id: forum
        if: steps.gate.outputs.run == '1' && steps.folder.outputs.md != ''
        run: |
          url=$(sed -n 's/^discussions:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}/\1/p' "${{ steps.folder.outputs.md }}" | head -1)
          topic=$(echo "$url" | grep -oE '[0-9]+/?$' | tr -d '/')
          if [ -z "$topic" ]; then
            echo "could not parse a topic id from discussions: $url"; echo "" > forum.txt
          else
            curl -fsSL "https://governance.aave.com/raw/$topic/1" -o forum.txt || echo "(forum fetch failed)" > forum.txt
          fi
      - uses: TokenLogic-com-au/github-workflows/.github/actions/scripts@main
        if: steps.gate.outputs.run == '1' && steps.folder.outputs.md != ''
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.gate.outputs.run == '1' && steps.folder.outputs.md != ''
        with:
          python-version: "3.12"
      - name: Trim forum text to its Motivation/Specification/Next Steps section(s)
        if: steps.gate.outputs.run == '1' && steps.folder.outputs.md != ''
        run: |
          # Cuts tokens on long funding posts; full post if no matching heading.
          python3 "$GW/forum_trim.py" forum.txt > forum.trimmed.txt
          mv forum.trimmed.txt forum.txt
      - name: Build AI input
        if: steps.gate.outputs.run == '1' && steps.folder.outputs.md != ''
        run: |
          {
            echo "<forum>"; cat forum.txt; echo "</forum>"
            echo "<proposal-md>"; cat "${{ steps.folder.outputs.md }}"; echo "</proposal-md>"
            echo "<diff-report>"
            [ -n "${{ steps.diff.outputs.report }}" ] && cat "${{ steps.diff.outputs.report }}"
            echo "</diff-report>"
          } > input.txt
      - name: Run spec-check AI call
        if: steps.gate.outputs.run == '1' && steps.folder.outputs.md != ''
        env:
          DRY_RUN: ${{ inputs.dry_run == false && '0' || '1' }}
          AI_API_STYLE: openai
          AI_API_URL: https://openrouter.ai/api/v1/chat/completions
          AI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_MODEL: ${{ vars.OPENROUTER_MODEL }}
          AI_MAX_TOKENS: "8000"
          AI_REASONING_EFFORT: "low"
          AI_RESPONSE_FORMAT: "json_object"
        run: |
          # Advisory: an AI failure must not turn the job red and block merges; log it into the comment.
          if ! python3 "$GW/ai.py" spec-check input.txt ai-out.md; then
            echo "_AI call failed (see job log for the reason); no spec-check table was generated for this run._" > ai-out.md
          fi
      - name: Print spec-check AI output
        if: steps.gate.outputs.run == '1' && steps.folder.outputs.md != ''
        run: |
          token=$(openssl rand -hex 16)
          echo "::group::spec-check AI output"
          echo "::stop-commands::$token"
          cat ai-out.md
          echo
          echo "::$token::"
          echo "::endgroup::"
      - name: Deterministic decimals-scale check
        if: steps.gate.outputs.run == '1' && steps.folder.outputs.md != ''
        run: |
          if [ -n "${{ steps.diff.outputs.report }}" ]; then
            python3 "$GW/scale_check.py" "${{ steps.diff.outputs.report }}" > scale-out.txt || true
          else
            echo "no diff report was generated for this proposal; decimals-scale check skipped" > scale-out.txt
          fi
      - name: Find the repo's PR template (if any)
        id: pr_template
        if: steps.gate.outputs.run == '1' && steps.folder.outputs.md != ''
        run: |
          tmpl=$(find .github -maxdepth 1 -iname 'pull_request_template.md' 2>/dev/null | head -1)
          echo "path=${tmpl:-}" >> "$GITHUB_OUTPUT"
      - name: Post one advisory comment
        id: post
        if: steps.gate.outputs.run == '1' && steps.folder.outputs.md != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          DRY_RUN: ${{ inputs.dry_run == false && '0' || '1' }}
          FORK_TEST_STATUS: ${{ steps.diff.outputs.fork_test_status }}
          # Env only, never interpolated into the script (untrusted PR value).
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TEMPLATE_PATH: ${{ steps.pr_template.outputs.path }}
        run: |
          if [ "$DRY_RUN" != "0" ]; then
            jq -nc --arg n "$NUMBER" '{would:"proposal-spec-comment",number:$n}' >&2
            exit 0
          fi
          diff_report_path="${{ steps.diff.outputs.report }}"
          printf '%s' "$FORK_TEST_STATUS" > fork-status.txt
          printf '%s' "$PR_BODY" > pr-body.txt
          if [ -n "$PR_TEMPLATE_PATH" ]; then
            cat "$PR_TEMPLATE_PATH" > pr-template.txt
          else
            : > pr-template.txt
          fi
          # 8th arg: address-book root, a second naming source for unlabelled parties; a missing path degrades silently.
          book_root="lib/aave-helpers/lib/aave-address-book"
          [ -d "$book_root" ] || book_root=""
          python3 "$GW/render_advisory_comment.py" ai-out.md "${diff_report_path:-/dev/null}" scale-out.txt body.md fork-status.txt pr-body.txt pr-template.txt "$book_root"
          diff_note="_Diff report: generated in CI by the fork test._"
          { printf '%s\n' "$MARKER"; printf '%s\n\n' "$diff_note"; cat body.md; } > comment.md
          existing=$(gh api --paginate "repos/$REPO/issues/$NUMBER/comments" | jq -rs --arg m "$MARKER" \
            '[.[][]|select(.user.login=="github-actions[bot]" and (.body|contains($m)))|.id]|max // empty')
          if [ -n "$existing" ]; then
            comment_id=$(gh api "repos/$REPO/issues/comments/$existing" -X PATCH -F body=@comment.md --jq .id)
          else
            comment_id=$(gh api "repos/$REPO/issues/$NUMBER/comments" -X POST -F body=@comment.md --jq .id)
          fi
          echo "comment_url=${{ github.event.pull_request.html_url }}#issuecomment-$comment_id" >> "$GITHUB_OUTPUT"
          if grep -qE '\[!(WARNING|CAUTION)\]' body.md; then
            echo "has_issues=1" >> "$GITHUB_OUTPUT"
          else
            echo "has_issues=0" >> "$GITHUB_OUTPUT"
          fi

  summary:
    needs: [scope, address-book, spelling, coverage, advisory]
    if: always() && needs.scope.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      SUMMARY_MARKER: "<!-- github-workflows-proposal-summary -->"
    steps:
      - uses: TokenLogic-com-au/github-workflows/.github/actions/scripts@main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Resolve the Upstream PR line
        id: upstream
        if: needs.scope.outputs.count == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          FORK_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          # Env only, never interpolated into the script (untrusted PR value).
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Recomputed every run so un-forking or re-pointing is picked up.
          repo_json=$(gh api "repos/$REPO" 2>/dev/null || echo '{}')
          is_fork=$(echo "$repo_json" | jq -r '.fork // false')
          parent_repo=$(echo "$repo_json" | jq -r '.parent.full_name // empty')
          parent_default_branch=""
          candidate_prs_json="[]"
          if [ "$is_fork" = "true" ] && [ -n "$parent_repo" ]; then
            parent_default_branch=$(gh api "repos/$parent_repo" --jq '.default_branch' 2>/dev/null || echo "")
            if [ -z "$parent_default_branch" ]; then
              echo "::warning::could not resolve the default branch for $parent_repo (gh api repos/$parent_repo failed or returned no default_branch); Upstream PR link will report a lookup failure"
            fi
            # pick_upstream_pr selects among candidates, not jq.
            candidate_prs_json=$(gh api "repos/$parent_repo/pulls?head=$FORK_OWNER:$HEAD_BRANCH&state=all" 2>/dev/null || echo '[]')
          fi
          fork_repo="${REPO#*/}"
          line=$(jq -n \
            --argjson is_fork "$is_fork" \
            --arg parent_repo "$parent_repo" \
            --arg parent_default_branch "$parent_default_branch" \
            --arg fork_owner "$FORK_OWNER" \
            --arg fork_repo "$fork_repo" \
            --arg head_branch "$HEAD_BRANCH" \
            --arg pr_title "$PR_TITLE" \
            --arg fork_pr_body "$PR_BODY" \
            --argjson candidate_prs "$candidate_prs_json" \
            '{is_fork:$is_fork, parent_repo:$parent_repo, parent_default_branch:$parent_default_branch,
              fork_owner:$fork_owner, fork_repo:$fork_repo, head_branch:$head_branch, pr_title:$pr_title,
              fork_pr_body:$fork_pr_body,
              candidate_prs: [$candidate_prs[] | {number, state, html_url, updated_at}]}' \
            | python3 "$GW/upstream_pr.py")
          echo "line=$(printf '%s' "$line" | base64 -w0)" >> "$GITHUB_OUTPUT"
      - name: Post the check summary comment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          DRY_RUN: ${{ inputs.dry_run == false && '0' || '1' }}
          SCOPE_COUNT: ${{ needs.scope.outputs.count }}
          RESULT_ADDRESS_BOOK: ${{ needs.address-book.result }}
          RESULT_SPELLING: ${{ needs.spelling.result }}
          RESULT_COVERAGE: ${{ needs.coverage.result }}
          RESULT_ADVISORY: ${{ needs.advisory.result }}
          DETAILS_ADDRESS_BOOK: ${{ needs.address-book.outputs.details }}
          DETAILS_SPELLING: ${{ needs.spelling.outputs.details }}
          DETAILS_COVERAGE: ${{ needs.coverage.outputs.uncovered }}
          COVERAGE_TESTS: ${{ needs.coverage.outputs.tests }}
          COVERAGE_PCT: ${{ needs.coverage.outputs.pct }}
          COVERAGE_MIN: ${{ needs.coverage.outputs.min_coverage }}
          ADVISORY_URL: ${{ needs.advisory.outputs.comment_url }}
          ADVISORY_HAS_ISSUES: ${{ needs.advisory.outputs.has_issues }}
          REPO_FULL: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          UPSTREAM_LINE: ${{ steps.upstream.outputs.line }}
        run: |
          if [ "$SCOPE_COUNT" = "0" ]; then
            echo "No proposal folder changed in this PR; proposal checks skipped." > summary_body.md
          else
            # details/uncovered are base64: multi-line GITHUB_OUTPUT delimiters failed matching on this runner.
            ab_d_plain=$(printf '%s' "$DETAILS_ADDRESS_BOOK" | base64 -d 2>/dev/null || true)
            sp_d_plain=$(printf '%s' "$DETAILS_SPELLING" | base64 -d 2>/dev/null || true)
            cov_d_plain=$(printf '%s' "$DETAILS_COVERAGE" | base64 -d 2>/dev/null || true)
            upstream_line_plain=$(printf '%s' "$UPSTREAM_LINE" | base64 -d 2>/dev/null || true)
            jq -n \
              --arg ab "$RESULT_ADDRESS_BOOK" --arg sp "$RESULT_SPELLING" \
              --arg cov "$RESULT_COVERAGE" --arg adv "$RESULT_ADVISORY" --arg adv_issues "$ADVISORY_HAS_ISSUES" \
              --arg ab_d "$ab_d_plain" --arg sp_d "$sp_d_plain" --arg cov_d "$cov_d_plain" \
              --arg cov_pct "$COVERAGE_PCT" --arg cov_min "$COVERAGE_MIN" --arg cov_tests "$COVERAGE_TESTS" \
              --arg adv_url "$ADVISORY_URL" \
              --arg repo "$REPO_FULL" --arg head_sha "$HEAD_SHA" --arg upstream_line "$upstream_line_plain" \
              '{
                results: {"address-book": $ab, spelling: $sp, coverage: $cov, advisory: $adv},
                advisory_has_issues: ($adv_issues == "1"),
                repo: $repo, head_sha: $head_sha,
                details: {"address-book": $ab_d, spelling: $sp_d, coverage: $cov_d},
                coverage_pct: $cov_pct, coverage_min: $cov_min, coverage_tests: $cov_tests,
                advisory_url: $adv_url,
                upstream_pr_line: $upstream_line
              }' > summary_payload.json
            python3 "$GW/render_summary_comment.py" < summary_payload.json > summary_body.md || \
              echo "_summary rendering failed; see the job log for individual check results._" > summary_body.md
          fi
          if [ "$DRY_RUN" != "0" ]; then
            jq -nc --arg n "$NUMBER" '{would:"proposal-summary-comment",number:$n}' >&2
            exit 0
          fi
          { printf '%s\n' "$SUMMARY_MARKER"; cat summary_body.md; } > summary_comment.md
          existing=$(gh api --paginate "repos/$REPO/issues/$NUMBER/comments" | jq -rs --arg m "$SUMMARY_MARKER" \
            '[.[][]|select(.user.login=="github-actions[bot]" and (.body|contains($m)))|.id]|max // empty') || true
          if [ -n "$existing" ]; then
            gh api "repos/$REPO/issues/comments/$existing" -X PATCH -F body=@summary_comment.md || true
          else
            gh api "repos/$REPO/issues/$NUMBER/comments" -X POST -F body=@summary_comment.md || true
          fi
