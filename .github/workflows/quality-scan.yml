name: quality-scan
# Batch scope-check of open board issues: lists issues via the board app,
# skips any that already carry the ai-comment marker, runs the same
# scope.md AI check + render as ai-comment.yml's scope path per issue, then
# hands the whole batch to board.py's quality-post subcommand.
on:
  workflow_call:
    inputs:
      statuses:
        type: string
        default: "To Do,In Progress,Blocked"
      max_issues:
        type: number
        default: 50
      dry_run:
        type: boolean
        default: true
      board_app_ref:
        required: true
        type: string
      backend:
        type: string
        default: openrouter
      config:
        required: true
        type: string
    secrets:
      BOARD_APP_PRIVATE_KEY:
        required: true
      ANTHROPIC_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false
      DISCORD_BOT_TOKEN:
        required: true
permissions: {}
defaults:
  run:
    shell: bash
env:
  DRY_RUN: ${{ inputs.dry_run == false && '0' || '1' }}
  MARKER: "<!-- github-workflows-ai -->"
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Validate required org variables
        run: |
          missing=()
          [ -z "${{ vars.TRACKER_REPO }}" ] && missing+=("vars.TRACKER_REPO")
          [ -z "${{ vars.BOARD_APP_REPO }}" ] && missing+=("vars.BOARD_APP_REPO")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Error: quality-scan requires the following org variables: $(printf '%s, ' "${missing[@]}" | sed 's/, $//')"
            exit 1
          fi
      - name: Mint checkout token (board app)
        id: mint-checkout
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BOARD_APP_ID }}
          private-key: ${{ secrets.BOARD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.BOARD_APP_REPO }}
          permission-contents: read
      - name: Check out the board app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/${{ vars.BOARD_APP_REPO }}
          ref: ${{ inputs.board_app_ref }}
          path: board-tool
          token: ${{ steps.mint-checkout.outputs.token }}
          persist-credentials: false
      - uses: TokenLogic-com-au/github-workflows/.github/actions/scripts@main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: List open issues from the board
        uses: ./board-tool
        with:
          command: open-issues
          statuses: ${{ inputs.statuses }}
          output: open-issues.json
          config: ${{ inputs.config }}
          app-id: ${{ vars.BOARD_APP_ID }}
          private-key: ${{ secrets.BOARD_APP_PRIVATE_KEY }}
      - name: Split issues into ndjson
        run: jq -c '.[]' open-issues.json > issues.ndjson
      - name: Scope-check each issue and collect results
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MAX_ISSUES: ${{ inputs.max_issues }}
          BACKEND: ${{ inputs.backend }}
          ANTHROPIC_API_KEY: ${{ inputs.backend == 'anthropic' && secrets.ANTHROPIC_API_KEY || '' }}
          AI_API_STYLE: ${{ inputs.backend == 'openrouter' && 'openai' || 'anthropic' }}
          AI_API_URL: ${{ inputs.backend == 'openrouter' && 'https://openrouter.ai/api/v1/chat/completions' || '' }}
          AI_API_KEY: ${{ inputs.backend == 'openrouter' && secrets.OPENROUTER_API_KEY || '' }}
          AI_MODEL: ${{ inputs.backend == 'openrouter' && vars.OPENROUTER_MODEL || '' }}
          AI_REASONING_EFFORT: ${{ inputs.backend == 'openrouter' && 'low' || '' }}
          AI_RESPONSE_FORMAT: ${{ inputs.backend == 'openrouter' && 'json_object' || '' }}
        run: |
          case "$BACKEND" in anthropic|openrouter) ;; *) echo "bad backend: $BACKEND"; exit 1;; esac
          echo "[]" > results.json
          items="[]"
          n=0
          while IFS= read -r issue; do
            n=$((n + 1))
            if [ "$n" -gt "$MAX_ISSUES" ]; then
              echo "max_issues ($MAX_ISSUES) reached; stopping scan"
              break
            fi
            number=$(printf '%s' "$issue" | jq -r .number)
            title=$(printf '%s' "$issue" | jq -r .title)
            url=$(printf '%s' "$issue" | jq -r .url)
            body=$(printf '%s' "$issue" | jq -r .body)
            status=$(printf '%s' "$issue" | jq -r .status)
            author=$(printf '%s' "$issue" | jq -r .author)
            assignees_line=$(printf '%s' "$issue" | jq -r '(.assignees // []) | join(", ")')
            assignees_json=$(printf '%s' "$issue" | jq -c '.assignees // []')
            existing=$(gh api --paginate "repos/$REPO/issues/$number/comments" | jq -rs --arg m "$MARKER" \
              '[.[][]|select(.user.login=="github-actions[bot]" and (.body|contains($m)))]|length')
            if [ "$existing" != "0" ]; then
              echo "issue #$number already has an AI comment; skipping"
              continue
            fi
            {
              echo "<issue-body>"
              printf '%s\n' "$body"
              echo "</issue-body>"
              echo "<assignees>${assignees_line}</assignees>"
              echo "<board-status>${status}</board-status>"
            } > "input-$number.txt"
            python3 "$GW/ai.py" scope "input-$number.txt" "out-$number.md"
            python3 "$GW/render_ai_comment.py" scope "out-$number.md" "$number" "body-$number.md"
            if [ "$DRY_RUN" != "0" ]; then
              echo "would post scope comment on #$number" >&2
            else
              { printf '%s\n' "$MARKER"; cat "body-$number.md"; } > "comment-$number.md"
              gh api "repos/$REPO/issues/$number/comments" -X POST -F body=@"comment-$number.md" >&2
            fi
            python3 "$GW/render_ai_comment.py" results "out-$number.md" "$number" "$title" "$url" "$assignees_json" "item-$number.json" "$author"
            items=$(jq -cs '.[0] + [.[1][0]]' <(printf '%s' "$items") "item-$number.json")
          done < issues.ndjson
          printf '%s' "$items" > results.json
      - name: Run batch issue quality check
        uses: ./board-tool
        with:
          command: quality-post
          args: batch results.json
          config: ${{ inputs.config }}
          app-id: ${{ vars.BOARD_APP_ID }}
          private-key: ${{ secrets.BOARD_APP_PRIVATE_KEY }}
          discord-bot-token: ${{ secrets.DISCORD_BOT_TOKEN }}
          board-live: ${{ !inputs.dry_run }}
          discord-live: ${{ !inputs.dry_run }}
      - name: Missing-fields digest (advisory job summary)
        uses: ./board-tool
        with:
          command: missing-fields
          statuses: ${{ inputs.statuses }}
          output: missing-fields.json
          config: ${{ inputs.config }}
          app-id: ${{ vars.BOARD_APP_ID }}
          private-key: ${{ secrets.BOARD_APP_PRIVATE_KEY }}
      - name: Render missing-fields digest
        run: |
          {
            echo "## Missing required board fields (advisory)"
            echo
            if [ "$(jq 'length' missing-fields.json)" = "0" ]; then
              echo "No open, scanned issue is missing a required field."
            else
              jq -r 'to_entries[] | "### \(.key)\n" + ([.value[] | "- [#\(.number) \(.title)](\(.url))"] | join("\n")) + "\n"' missing-fields.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"
