name: no-reviewer-reminder
# Scheduled: finds open, non-draft PRs across the org with no requested reviewer and no
# review, ready for review for at least the configured threshold (board-app config's
# `no_reviewer_hours`), and pings the PR author on Discord via the roster. Dedupes per
# PR with a marker comment on the PR itself, posted only once the ping actually goes out
# (never in dry-run) -- board.py's `no-reviewer-ping` subcommand owns the whole flow.
on:
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: true
      board_app_ref:
        required: true
        type: string
      config:
        required: true
        type: string
    secrets:
      BOARD_APP_PRIVATE_KEY:
        required: true
      DISCORD_BOT_TOKEN:
        required: true
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  remind:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate required org variables
        run: |
          if [ -z "${{ vars.BOARD_APP_REPO }}" ]; then
            echo "Error: no-reviewer-reminder requires vars.BOARD_APP_REPO to be set"
            exit 1
          fi
      - name: Mint checkout token (board app)
        id: mint-checkout
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BOARD_APP_ID }}
          private-key: ${{ secrets.BOARD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.BOARD_APP_REPO }}
          permission-contents: read
      - name: Check out the board app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/${{ vars.BOARD_APP_REPO }}
          ref: ${{ inputs.board_app_ref }}
          path: board-tool
          token: ${{ steps.mint-checkout.outputs.token }}
          persist-credentials: false
      - name: Run board.py no-reviewer-ping
        uses: ./board-tool
        with:
          command: no-reviewer-ping
          config: ${{ inputs.config }}
          app-id: ${{ vars.BOARD_APP_ID }}
          private-key: ${{ secrets.BOARD_APP_PRIVATE_KEY }}
          discord-bot-token: ${{ secrets.DISCORD_BOT_TOKEN }}
          board-live: ${{ !inputs.dry_run }}
          discord-live: ${{ !inputs.dry_run }}
